    <style>

<script>
    const PARSED_ELEMENTS = [{"type":"text","data":"<p>Win knocked over a metal trash can and kicked a concrete barrier to attract attention, but the crowd simply ignored him.</p>"},{"type":"text","data":"<p>He rested his right hand atop his cap and looked around at the shoppers and commuters filling the plaza.</p>"},{"type":"text","data":"<p>The area was massive... spanning a multi-block mall, a train station, a bus hub, and various amenities like banks and restaurants, making it the perfect place to pull off a reckless stunt.</p>"},{"type":"text","data":"<p>So why was nothing working?</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Man, why didn't Sai tell me where I should be?”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Tako, what should I do?”</p>"},{"type":"text","data":"<p>Tako shifted inside Win's chest pocket, poking his head out.</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “That electricity filled block... use it.”</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “Inquire the green-haired man.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “...You want me to call Sai?”</p>"},{"type":"text","data":"<p>Win pulled out his phone and swept through his unread messages, hitting select all and read all except for Sai's texts.</p>"},{"type":"text","data":"<p><strong>SAI: “If you get lost (which I know you will), go to the commercial plaza.”</strong></p>"},{"type":"text","data":"<p><strong>SAI: “It's close to where I robbed the bank with Andy last time, I learnt that they occasionally do check-ups in that area.”</strong></p>"},{"type":"text","data":"<p>Win held his phone up in the air, aligning the screen with the metal signboard in front of him.</p>"},{"type":"text","data":"<p><em>Loop's State Street.</em></p>"},{"type":"text","data":"<p>It was the exact location as the attachment Sai sent.</p>"},{"type":"text","data":"<p>He walked out into the open centre of the plaza and took a deep breath.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I'M A TERRO—”</p>"},{"type":"text","data":"<p>A stinging sensation hit his chest as Tako bit down from inside the pocket. Tako spat out a tiny piece of fabric.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Ow!”</p>"},{"type":"text","data":"<p>To avoid looking like he was talking to his own nipple, Win walked away to gauge his next move.</p>"},{"type":"text","data":"<p>He patted Tako with his index finger. His eyes then landed on a cluster of transformer boxes, backup generators, and electrical appliances lining the side of the block.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Electricity filled block... you weren't talking about my phone, were you?”</p>"},{"type":"text","data":"<p>Win walked over to the machinery. He began punching the appliances and generators, denting the metal frames and breaking the casings to elevate attention.</p>"},{"type":"text","data":"<p>It is true, commuters were already stopping and staring with clear suspicion.</p>"},{"type":"text","data":"<p>Win wiped a bead of sweat from his brow and sat down on the pavement.</p>"},{"type":"text","data":"<p>He then pulled out a thick stack of paper and began folding the sheets over each other, gradually shaping them into a sphere.</p>"},{"type":"text","data":"<p>A bystander giggled at him.</p>"},{"type":"text","data":"<p class=\"d\">BYSTANDER: “He vandalized public infrastructure and started making origami. Some retirement home lose a client?”</p>"},{"type":"text","data":"<p>Across the street, Raymond walked while messily shuffling a thick stack of documentation regarding <em>The Individuals.</em></p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Some people trouble you so much just because of something so mild.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “It could be because I’m just bad at communicating but...”</p>"},{"type":"text","data":"<p>Raymond tripped over his own foot, sending two papers flying. One dropped straight down a storm drain, while the other landed on the pavement and immediately got stepped on by the passing crowd.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “How lucky...”</p>"},{"type":"text","data":"<p><strong>KABOOOOMMMM</strong></p>"},{"type":"text","data":"<p>A massive explosion suddenly detonated from the sabotaged electrical boxes from a street away.</p>"},{"type":"text","data":"<p>Screaming pedestrians scrambled in all directions to flee the blast.</p>"},{"type":"text","data":"<p>A man stood calmly in the middle of the clearing. He was wearing a jumpsuit, a fixer’s cap and round glasses. He coughed and wiped dust off his clothes.</p>"},{"type":"text","data":"<p>Raymond looked down at the stained paper on the ground.</p>"},{"type":"text","data":"<p><em>This is...</em></p>"},{"type":"text","data":"<p>As the dust began to clear, Tako crawled up onto Win's shoulder.</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “You overdid it.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Isn't that a good thing?”</p>"},{"type":"text","data":"<p>Tako adjusted himself into a loaf position.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “...Still got nothing out of it, honestl—”</p>"},{"type":"text","data":"<p><strong>SMACK</strong></p>"},{"type":"text","data":"<p>Win managed to raise his arm to catch a sudden punch.</p>"},{"type":"text","data":"<p>A man had initiated the fight, his tie had loosened against his navy-coloured, untucked uniform when he lunged at Win.</p>"},{"type":"text","data":"<p>Win kicked him away, but the opponent softened the impact by blocking the strike with his free palm.</p>"},{"type":"single-img","url":"image\\07/1.png"},{"type":"single-img","url":"image\\07/2.png"},{"type":"single-img","url":"image\\07/3.png"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Good to see a terrorist in open space.”</p>"},{"type":"text","data":"<p>Raymond wiped his palm against his thigh.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “I'm Raymond, from the O.S.I.R.I.S.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Hi, I'm Win.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Can we negotiate?”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I would like you to put down our bounties.”</p>"},{"type":"text","data":"<p>Raymond stared at him with a completely flat expression.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Is that seriously why you did all that...?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...Nevermind. Alright, alright, makes my job easier anyways.”</p>"},{"type":"text","data":"<p>Raymond put his hand out in front of him and clenched it into a tight fist.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “We will give you your peace if you agree to our conditions.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “One. You must legally confess the crimes you have did, serving as an insurance policy for O.S.I.R.I.S.”</p>"},{"type":"text","data":"<p>Raymond raised one finger.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Two. At least two of the members in your faction must work for us to make up for our lack of manpower, though this will only happen after those members have successfully passed our tests.”</p>"},{"type":"text","data":"<p>Raymond raised a second finger.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Three. You must refrain from ever committing any crimes ever again.”</p>"},{"type":"text","data":"<p>Raymond raised a third finger.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “So?”</p>"},{"type":"text","data":"<p>Win stood there for a moment, tapping his chin thrice to consider the offer.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I agre—”</p>"},{"type":"text","data":"<p>Tako lurched forward from his shoulder and smacked Win on the forehead.</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “Do not.”</p>"},{"type":"text","data":"<p>Win pushed Tako's paper paws aside, straightened his posture, and looked Raymond dead in the eye.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I do not agree.”</p>"},{"type":"text","data":"<p>Raymond’s eyes widened. He had realized that the origami creature was sentient.</p>"},{"type":"text","data":"<p>Win whispered to Tako.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Come on Tako, we almost had it... Why'd you stop me?”</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “That guy smells bad.”</p>"},{"type":"single-img","url":"image\\07/4.png"},{"type":"single-img","url":"image\\07/5.png"},{"type":"single-img","url":"image\\07/6.png"},{"type":"text","data":"<p>It was getting heated up. So much so that their physical momentums were forcing them toward a dentistry storefront.</p>"},{"type":"text","data":"<p>Raymond threw a punch. Win caught the fist in his palm. Win sent a straight punch.</p>"},{"type":"text","data":"<p>Raymond caught Win's fist with his free hand, leaving them locked together.</p>"},{"type":"text","data":"<p>Win stamped down on Raymond's foot. Raymond pulled his weight back and drove his knee upward into Win's chin.</p>"},{"type":"text","data":"<p>The impact knocked Win backward toward the large glass panel of the dentistry.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Hey... hey...”</p>"},{"type":"text","data":"<p>Win planted his boots, scraping it against the ground. He’s trying to avoid smashing into the window.</p>"},{"type":"text","data":"<p>Raymond threw another punch, driving his fist straight past Win who dodged at the last second and shattering the glass panel completely.</p>"},{"type":"text","data":"<p>Win's eyes widened by a bit.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “You're gonna get bad luck from doing that.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Huh?”</p>"},{"type":"paired-double","left":"image\\07/bigpuncher-split.png","right":"image\\07/bigpuncher-split(1).png"},{"type":"text","data":"<p>Raymond tumbled backward through the shattered glass, crashing into the dentistry check-in counter. The counter attendant looked down at him, sighed, and picked up the landline phone to call the police.</p>"},{"type":"text","data":"<p>Raymond snatched the receiver from her hand.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “No need, I’m with the police.”</p>"},{"type":"text","data":"<p>The attendant turned and walked out through a back door.</p>"},{"type":"text","data":"<p>Raymond tossed the heavy phone handset. Win raised his forearm and smashed the flying device away. Raymond lunged forward, closing his fist. All five knuckles cracked directly against Win's nose, hurling him backward.</p>"},{"type":"text","data":"<p>A sharp, rustling texture crawled up the back of Raymond’s neck and settled behind his ear. It felt like stiff, harsh paper.</p>"},{"type":"text","data":"<p>Tako chomped down on the edge of Raymond’s ear.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “What the fuck!?”</p>"},{"type":"text","data":"<p>Raymond reached up, gripped the paper creature, and ripped it away. He slammed Tako face-down onto an open logbook on the counter, then slammed the heavy book shut.</p>"},{"type":"text","data":"<p>Raymond turned his head back toward Win's last position. The space was empty.</p>"},{"type":"text","data":"<p>A sudden rustle sounded from behind.</p>"},{"type":"text","data":"<p>Win dropped a thick plastic bag over Raymond’s head, layering it two or three times. He pulled the plastic tight around Raymond's neck, quickly knotting it to cut off his air.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I know why you’re unlucky.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Because you only think about yourself.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...Fucking... loser...”</p>"},{"type":"text","data":"<p>Win wrapped his forearm around Raymond’s throat, choking him. They wrestled across the floor, crashing through a door into an inner operating room.</p>"},{"type":"text","data":"<p>Raymond hit the linoleum whereas Win collided with a metal tray stand.</p>"},{"type":"text","data":"<p>A tall, well-groomed dentist stood over the operating chair. An assistant stood by his side observing quietly. The patient in the chair wore over-ear headphones, practically sleeping.</p>"},{"type":"text","data":"<p class=\"d\">DOCTOR: “Shut up, I’m trying to focus.”</p>"},{"type":"text","data":"<p class=\"d\">ASSISTANT: “That wasn’t me, two dudes just went crashing into the room.”</p>"},{"type":"text","data":"<p class=\"d\">DOCTOR: “Yeah, but you’re talking now, so shut up.”</p>"},{"type":"text","data":"<p>Win leapt toward Raymond. Raymond raised both boots and kicked Win squarely in the chest, launching him directly into the dentist.</p>"},{"type":"text","data":"<p>The impact sent them crashing into a supply rack. Scalpels, electric toothbrushes, dental probes, and a plastic package of discarded teeth spilled all over the floor.</p>"},{"type":"text","data":"<p>Win scrambled on his knees, feeling around the scattered equipment to grab a weapon, a non-conventional one for sure.</p>"},{"type":"text","data":"<p>Across the room, Raymond used his fingers to tear open the plastic layers over his face, gasping for air.</p>"},{"type":"text","data":"<p>They both stood up simultaneously.</p>"},{"type":"text","data":"<p>Win moved with slow, careful steps, trying not to disturb the patient out of a well-mannered tendency. Raymond sprinted straight at him though, making said effort useless.</p>"},{"type":"text","data":"<p>Win lunged with a dental probe. He drove the metal tip through Raymond’s cheek, piercing into his mouth.</p>"},{"type":"text","data":"<p>Raymond, however, clamped his teeth down onto the metal rod, locking it in place, and threw a heavy hook punch to Win's jaw.</p>"},{"type":"text","data":"<p>Raymond’s hand caught a dental mirror on the tray.</p>"},{"type":"text","data":"<p>He angled the mirror downward, catching a reflection from underneath the patient’s bed.</p>"},{"type":"text","data":"<p>Win stared into the small glass circle.</p>"},{"type":"text","data":"<p>And underneath the bed—</p>"},{"type":"single-img","url":"image\\07/7.png"},{"type":"text","data":"<p>Raymond grabbed Win, slung him over his elbow, and threw him out of the operating room.</p>"},{"type":"text","data":"<p>He walked out after Win. He kicked Win through the broken storefront onto the street, sending him skidding against a parked car.</p>"},{"type":"text","data":"<p>Win gripped the car door handle, trying to bring himself to stand upright.</p>"},{"type":"text","data":"<p>A scalpel pierced straight through Win’s hand, pinning his palm to the car door.</p>"},{"type":"text","data":"<p><em>Clunk.</em></p>"},{"type":"text","data":"<p>Raymond had dropped the dental probe impaled to him, then he used his tie to pat his punctured cheek.</p>"},{"type":"text","data":"<p>Raymond stood before him and taunted.</p>"},{"type":"single-img","url":"image\\07/8.png"},{"type":"single-img","url":"image\\07/9.png"},{"type":"text","data":"<p>He slammed Raymond's head onto the side of a car. Pressing his skull against the metal with force. Then, he dropped the body.</p>"},{"type":"text","data":"<p>Though, Raymond was still there. He stood behind Win. This prompted Win to rip the door handle off the car and hurl it.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “What the hell, man!?”</p>"},{"type":"single-img","url":"image\\07/10.png"},{"type":"text","data":"<p class=\"d\">WIN: “I thought I got him...?”</p>"},{"type":"text","data":"<p>Raymond walked up from the side and placed a hand on Win's shoulder.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Did you?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “My ability imposes the Fregoli effect onto those who saw it.”</p>"},{"type":"text","data":"<p>Win wasn't quite listening. He swung his arm backward. Raymond crouched under the swing and drove his fist up into Win's stomach, lifting him off the ground.</p>"},{"type":"single-img","url":"image\\07/11.png"},{"type":"text","data":"<p>Win clutched at his midsection and pulled himself up. Tako climbed out of Win's collar and sat on his shoulder.</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “You killed two innocents.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Huh? I didn't kill ‘two innocents,’ I'm sure I fatally wounded him twice, he should be knocked out cold...!”</p>"},{"type":"text","data":"<p>Raymond walked over to an elderly woman's corpse by the car, picked up her wooden cane, and approached Win. He raised the cane and struck Win across the shoulder.</p>"},{"type":"text","data":"<p>Win's body burst into loose sheets of paper. The paper floated over a ten-foot chain-link fence and reassembled into Win's physical form on the top rail.</p>"},{"type":"text","data":"<p>Win crouched on the fence, dropped down to the opposite side, and ran.</p>"},{"type":"text","data":"<p>He ran around a corner and nearly collided with a package handler holding a wooden box, forcing him to stop in shock.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “How did you catch up to me?”</p>"},{"type":"text","data":"<p class=\"d\">PACKAGE HANDLER: “What?”</p>"},{"type":"text","data":"<p>Win swept his leg across the handler's ankles, knocking him down. He grabbed the box, brought it down onto the handler's head, and stomped on it until blood spilled out from underneath.</p>"},{"type":"text","data":"<p>A second worker stepped out of a nearby warehouse door, drawing a handgun. He fired one shot.</p>"},{"type":"text","data":"<p>Win jumped sideways, onto the side of a delivery truck.</p>"},{"type":"text","data":"<p>The armed worker walked toward the side of the truck. As he reached the front fender, the metal structure exploded into loose papers.</p>"},{"type":"text","data":"<p>Win materialized behind the worker, locking his forearm around the man's throat. The worker thrashed. Win pressed his palm against the worker's face, dragging his fingernails across the skin before letting it burst under his hand.</p>"},{"type":"text","data":"<p>The worker fell to the ground, letting go of his gun. Win picked up the dropped handgun, pressed it on the man's open eye, and shot him seven times.</p>"},{"type":"text","data":"<p>Win stood over the body, breathing heavily.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “That should... do it...”</p>"},{"type":"text","data":"<p>Four warehouse employees walked out of the loading bay and stopped, staring at Win and the body.</p>"},{"type":"text","data":"<p>Win stood still for two seconds, turned, and sprinted away.</p>"},{"type":"text","data":"<p>Win ran down the street with Tako on his shoulder who was shaking its head in a sign of disapproval.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I snapped his neck, I crushed his skull, I even shot him seven times.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Why is he not dead? How does he keep catching up to me??”</p>"},{"type":"text","data":"<p>Win stepped out of the alley, aiming for somewhere secluded. Or in his head, a place where Raymond would stop catching up to try to kill him.</p>"},{"type":"text","data":"<p>A uniformed security guard stepped into his path, extending both hands.</p>"},{"type":"text","data":"<p class=\"d\">SECURITY GUARD: “Stop right there!”</p>"},{"type":"text","data":"<p class=\"d\">SECURITY GUARD: “Drop your handgun and put your hands where I can see them!”</p>"},{"type":"text","data":"<p>Win raised the handgun and aimed it at the guard's face.</p>"},{"type":"text","data":"<p><em>An ability? Is that it?</em></p>"},{"type":"text","data":"<p><em>He mentioned something about a Fregoli delusion...</em></p>"},{"type":"text","data":"<p><em>But...</em></p>"},{"type":"text","data":"<p><em>What even is that?</em></p>"},{"type":"text","data":"<p class=\"d\">WIN: “How?”</p>"},{"type":"text","data":"<p class=\"d\">SECURITY GUARD: “How what!? Just put your goddamn weapon on the floor, shit is not that hard to understand!”</p>"},{"type":"text","data":"<p>Win pulled the trigger.</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “Calm down.”</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “Drop your weapon.”</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “Stop being reckless.”</p>"},{"type":"text","data":"<p>Win ran out of the terminal toward the street. A sedan braked suddenly, the bumper hovering inches from his legs. Win stared through the windshield at the driver.</p>"},{"type":"text","data":"<p>His opponent was driving the car.</p>"},{"type":"text","data":"<p>Win dropped the gun onto the asphalt. He walked across the street to a concrete bus shelter. The people waiting there ran away in fear as he approached.</p>"},{"type":"text","data":"<p>He leaned his forehead against the metal pole of the sign.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “It must be me.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I think my brain is being messed with.”</p>"},{"type":"text","data":"<p>A transit bus pulled up to the curb and opened its doors.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “If it's true... then....”</p>"},{"type":"text","data":"<p>Win looked inside the vehicle. The passengers stared at him in awe, horror, and morbid curiosity. Win stepped onto the bus reluctantly, daring to put his theory to the test.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Tako... are these people really...”</p>"},{"type":"text","data":"<p>A voice spoke from behind him on the step.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Hey.”</p>"},{"type":"text","data":"<p>Win turned around.</p>"},{"type":"single-img","url":"image\\07/12.png"},{"type":"text","data":"<p>Raymond stepped aboard just before the bus moved and drew a pistol. He aimed at Win and pulled the trigger.</p>"},{"type":"text","data":"<p>Win ducked the shot and rammed forward, slamming his shoulder into Raymond's body and pinning him against the closed accordion doors.</p>"},{"type":"text","data":"<p>Raymond aimed and pulled the trigger. Somehow, it had no weight, no resistance. The trigger slapped around loosely without engaging any mechanism.</p>"},{"type":"text","data":"<p>Tako peeked at Raymond from the side of the barrel, chewing like he was having the time of his life. Right after, the gun ruptured into paper in Raymond's hand.</p>"},{"type":"text","data":"<p>Annoyed by what happened to his gun, Raymond took a step back and snatched a stylus pen from a girl drawing on her tablet.</p>"},{"type":"text","data":"<p>Raymond drew his arm back and, before Win could knock him fully down, hurled the pen straight at the driver's seat. It pierced through the cushion and came out the driver's forehead.</p>"},{"type":"text","data":"<p>The bus accelerated forward, colliding with the rear of a parked car before swerving into the opposite lane at full speed. Passengers tumbled through the aisle, sending Win flying to the back of the bus, right into the emergency door.</p>"},{"type":"text","data":"<p>Raymond was lost somewhere in the crowd. Worse yet, it was a crowd in which Win was convinced every single head was Raymond's.</p>"},{"type":"text","data":"<p>He held back the urge to throw up.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Damn...”</p>"},{"type":"text","data":"<p>Win slammed his palm against the door frame four times.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I just remembered...”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “...I haven't released <em>Papercut</em> yet.”</p>"},{"type":"paired-double","left":"image\\07/fym-split.png","right":"image\\07/fym-split(1).png"},{"type":"text","data":"<p>Sharp papercuts burst open across the real Raymond's arms and face. Win lunged across the aisle and grabbed Raymond by both arms.</p>"},{"type":"text","data":"<p>The emergency door exploded into a cloud of paper sheets. The rushing air pulled multiple passengers and both men out of the back of the moving bus onto the asphalt.</p>"},{"type":"text","data":"<p>Raymond gritted his teeth. Win wouldn't dare to let go.</p>"},{"type":"text","data":"<p>They rolled across the street and fell through an open manhole cover.</p>"},{"type":"text","data":"<p>They dropped into a concrete maintenance tunnel. Win hit the floor first, taking the impact beneath Raymond.</p>"},{"type":"text","data":"<p>Raymond stood up, using a rusted wall pipe for balance, and began walking down the corridor away from Win.</p>"},{"type":"text","data":"<p>Tako crawled out of Win's shoe, climbed up his chest, and licked Win's nose.</p>"},{"type":"text","data":"<p>Slowly, Win opened his eyes.</p>"},{"type":"text","data":"<p>Raymond stopped walking, though he did not turn around.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “They say your ability reflects something about you, so you must really have--”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Okay, Joe Sixpack, you're a gang member, don't preach to me about morality.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “…Sorry.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Stand there.”</p>"},{"type":"text","data":"<p>…</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “I wanna understand your heap of nonsense.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “That ‘bad luck’ thing you preached about.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Okay.”</p>"},{"type":"text","data":"<p>Win tapped his chin twice.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I think luck is influenced by one’s moral standing. Or no, actually, their level of niceness.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “That’s why I advised you not to be selfish.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Because bad luck comes from being a bad person.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Conversely, I try to do good.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Of course, breaking a mirror or walking under a ladder can also bring bad luck.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “But most dangerously, what I see in you is selfishness and a lack of empathy.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “That puts you in a very bad place according to the rule of luck.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “YOUR rule of luck.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “No matter, because luck is real.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...Simple-minded. I like it.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Doesn’t change the fact that you killed a bunch of people back there, though.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “So your standing shouldn't be that different from mine.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Technically, they died because of your ability.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “So it's your fault, not mine.”</p>"},{"type":"text","data":"<p>Raymond chuckled.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “My fault?”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Yes, and you will suffer from even worse luck because of it.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “So this is your last chance to do good.”</p>"},{"type":"text","data":"<p>Win cleared his throat.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Can you take our bounty off?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Nice try.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “But I don’t believe in luck.”</p>"},{"type":"text","data":"<p>Raymond popped a valve open by a strike of his elbow. The giant rusted pipe next to them begun shaking uncontrollably before flooding the tunnel with steam.</p>"},{"type":"text","data":"<p>It’s hard to see. As if it wasn’t already dark in here, now, this place is filled with thick smoke.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “You are...”</p>"},{"type":"text","data":"<p>Raymond charged in a zig-zag, closing the distance faster than a straight line should allow.</p>"},{"type":"single-img","url":"image\\07/13.png"},{"type":"text","data":"<p>Every hit Win landed burst instantly, papercuts blooming across whatever patch of Raymond they touched, and every single one stung like hell.</p>"},{"type":"text","data":"<p>Win threw a hook and missed. His fist caught the overhead pipe instead, and the metal disintegrated into a shower of paper, sending steam pouring out of the gap.</p>"},{"type":"text","data":"<p>Fists, forearms, the wet smack of knuckles on lips, Raymond throwing everything he had and Win throwing it back cheaper, faster, and maybe dumber.</p>"},{"type":"text","data":"<p>Even so, it was clear Win was winning the exchange. Not that he was any good in close quarters, but every time a hit landed, patches of skin burst into paper and left searing cuts, so even the sloppiest smack stung like a bitch.</p>"},{"type":"text","data":"<p>Worse yet, the temperature was rising and breathing was getting hard. They were sweating through their clothes while each tried to split the other's skull open.</p>"},{"type":"text","data":"<p>Raymond stopped trading. He forced himself to stop, letting his arms drop even though every nerve in him wanted to keep swinging, because he'd done the math under all that adrenaline and knew he was losing this on volume.</p>"},{"type":"text","data":"<p><em>The smartest move right now...</em></p>"},{"type":"text","data":"<p>He let the next cloud of steam swallow him whole, crouching against a huge, rattling pipe.</p>"},{"type":"text","data":"<p>Raymond whispered to himself.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “No way in hell are you going to survive this unregulated sauna with all those wounds...”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “I'll win by just stalling the shit out of you...!”</p>"},{"type":"text","data":"<p>For a brief minute, he sat there.</p>"},{"type":"single-img","url":"image\\07/14.png"},{"type":"text","data":"<p>Raymond saw a loose drift of paper turning in slow circles in the air, maybe ten feet off the ground, looking easy and unbothered, as if the heat and lack of oxygen meant nothing.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Shit...”</p>"},{"type":"text","data":"<p>That was Win. And if Win could just float there like that, stalling wasn't a smart strategy. Raymond needed Win to spend energy too, because at this rate, Raymond would collapse first — a humiliating defeat for sure.</p>"},{"type":"text","data":"<p>He crawled toward the boiler against the far wall, reached into its guts where the wiring ran exposed, and grabbed two handfuls, yanking them together.</p>"},{"type":"text","data":"<p><strong><em>KABOOM.</em></strong></p>"},{"type":"text","data":"<p>The boiler erupted in a flash of white, followed by the low glow of embers.</p>"},{"type":"text","data":"<p>Flames quickly spread across the room. It got hotter, breathing grew brutally hard, and it wouldn't be a surprise if anyone died of heatstroke right then and there.</p>"},{"type":"text","data":"<p>Raymond scrambled for the ladder, climbing fast as the warm steel grew progressively hotter under his grip. Still, he took one last look back at the floating papers.</p>"},{"type":"text","data":"<p>The scraps were catching fire now, fluttering down to the floor and reducing to ash.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “And I thought I was going to suffer a stupid death.”</p>"},{"type":"text","data":"<p>Before he could turn around to keep climbing, something caught his leg.</p>"},{"type":"single-img","url":"image\\07/15.png"},{"type":"text","data":"<p>With a single tug, Raymond found himself sliding down the ladder. A swing of an arm volleyed his face before he could reach the floor, cracking it against the ladder he was just climbing.</p>"},{"type":"text","data":"<p>Win kept going. He grabbed the front of Raymond's shirt with the same arm and slammed him back into the ladder's grate.</p>"},{"type":"text","data":"<p>With Raymond's head caught between the steps, Win pummeled his neck with one arm.</p>"},{"type":"text","data":"<p><em>He only has one arm...?</em></p>"},{"type":"text","data":"<p><em>Damn it... so the floating bundle of paper was...</em></p>"},{"type":"single-img","url":"image\\07/16.png"},{"type":"text","data":"<p><em>His arm!!</em></p>"},{"type":"text","data":"<p>The fire came up the walls in sheets now, eating the paper insulation, pipes, and rubbish.</p>"},{"type":"text","data":"<p><em>I have to fight back! At this rate, I'm gonna die!</em></p>"},{"type":"text","data":"<p><em>No... hold on...!</em></p>"},{"type":"text","data":"<p>There's no way he's going to make it through this! He's missing an arm, he's losing blood, his body temperature has got to be skyrocketing, and he's taken a huge beating, too...</p>"},{"type":"text","data":"<p>So Raymond just stood there and took it. He let the one good fist land where it wanted: on his jaw, his ribs, his neck, and the ladder's grate.</p>"},{"type":"text","data":"<p>The only thing that mattered right now was who would break first and who would break out of here first.</p>"},{"type":"text","data":"<p>It was becoming obvious.</p>"},{"type":"text","data":"<p>Win's swings started missing their mark. His body began to slouch and go limp, his punches lacking their former force.</p>"},{"type":"text","data":"<p>Eventually, he stopped punching altogether, swaying on his feet. Worse, his jumpsuit was starting to burn around the edges.</p>"},{"type":"text","data":"<p>Raymond took this opportunity to pull his head out from between the ladder steps.</p>"},{"type":"text","data":"<p>Win's remaining hand shot out and pressed his thumb against his burning clothes, mimicking the gesture of striking a lighter.</p>"},{"type":"text","data":"<p>The thumb changed into paper and caught fire.</p>"},{"type":"text","data":"<p>Just as Raymond was about to escape, Win grabbed the back of his head.</p>"},{"type":"single-img","url":"image\\07/17.png"},{"type":"text","data":"<p class=\"d\">RAYMOND: “You fucking son of a...”</p>"},{"type":"single-img","url":"image\\07/18.png"},{"type":"text","data":"<p>Win sat shirtless at the lip of the hole he had dug, tossing patches of grass down every five seconds.</p>"},{"type":"text","data":"<p>Raymond woke up right as a blade of grass fell on his nose, sneezing loudly, which made Tako startle awake from Win’s lap.</p>"},{"type":"text","data":"<p>He looked up at Win. His whole body still ached. Then he looked at his hands, as they felt rather... off.</p>"},{"type":"text","data":"<p>His fingers were gone, but where the open wounds should be was paper, keeping him from bleeding out. It was likely a gesture of kindness, since it didn’t hurt at all.</p>"},{"type":"text","data":"<p>Charred body. Head feeling like it was melting. And now, his missing fingers.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “You’re sicker than you appear to be.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “You couldn’t just kill me? Instead, you toss me in a deep hole and cut my fingers off?”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Take our bounty off.”</p>"},{"type":"text","data":"<p>Raymond stared up at him. Looking too long at his mutilated fingers was starting to make him nauseous.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I’ll get you healed in return. I know a guy.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Not afraid your luck will turn bad?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...I’m a forensic inspector. I don’t even have control over—”</p>"},{"type":"text","data":"<p>It would still be better to give him something. Who knows what this dense, insane guy would do if he learned he was leaving empty-handed.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Shit... fine. Pull me up.”</p>"},{"type":"text","data":"<p>Raymond walked toward a rusted railing overlooking the blocks below. There was an occasional view. Smoke rose from an elderly person’s house somewhere, shortly followed by the blaring siren of a firetruck.</p>"},{"type":"text","data":"<p>Win walked toward Raymond and settled next to him, taking in the view. Tako hopped onto the railing and perched there.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “So who do I talk to?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Give me your phone.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Huh...”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Do you want the contact or not?”</p>"},{"type":"text","data":"<p>Raymond tip-tapped Win’s phone slowly and carefully. Realizing his fingers wouldn’t do it, he used his nose instead.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I didn’t actually expect you to help out.”</p>"},{"type":"text","data":"<p>Raymond handed the phone back to him.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “I’m not like my co-workers. I care more about staying alive than I do about anything they’d ask me to die for. That ‘honor’ or ‘dignity’ shit doesn’t matter. Or I guess, it only matters if it affects me.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Who knows, maybe I complied out of respect.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “But I thought you disliked me.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “I’m convinced you’ve got a crayon lodged in your hypothalamus. But that’s different from hating you.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “How so?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “...Just enjoy the view.”</p>"},{"type":"text","data":"<p>And so they did. Below, small as an ant from this height, a man tripped onto the ground. Two men in suits followed close behind him. A single gunshot cracked a second later.</p>"},{"type":"text","data":"<p>Win pointed at them.</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Those guys are gonna have bad luck for a while.”</p>"},{"type":"text","data":"<p>Raymond turned his head toward Win.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “You’ve got a knack for labeling things.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “It’s just my observation.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Everyone can agree that this world is not optimal.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “I think it’s the way it is because of bad luck.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “So, whenever someone does something wrong, something bad happens because of bad luck, which makes the world degrade.”</p>"},{"type":"text","data":"<p class=\"d\">TAKO: “He guides people to the right path.”</p>"},{"type":"text","data":"<p>Raymond didn’t say anything for a moment. He would've asked, \"And if they didn't listen?\" but he was afraid he knew what the answer would be. He picked at the drying blood on his burnt knuckles instead.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Calling the world sub-optimal is like hurling a rock at a train for moving forward. You’re right about half of it, though.”</p>"},{"type":"text","data":"<p>Raymond looked down, leaning further over the railing. He sighed.</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “In a way, certain actions do lead to quote-unquote bad luck.”</p>"},{"type":"text","data":"<p class=\"d\">WIN: “Yes, you finally understand what I’m trying to say.”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “There’s really no point debating with you, isn't it?”</p>"},{"type":"text","data":"<p class=\"d\">RAYMOND: “Just take me to your friend already.”</p>"},{"type":"single-img","url":"image\\07/extras.png"}];
    let PAGINATED_PAGES = [];
    let currentSpread = 0;

    function reflowContent() {
        if (PARSED_ELEMENTS.length === 0) return;

        if (window.innerWidth <= 900 && window.innerHeight > window.innerWidth) {
            PAGINATED_PAGES = [];
            let blockBuffer = "";
            PARSED_ELEMENTS.forEach(el => {
                if (el.type === 'paired-double') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.left + '">' });
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.right + '">' });
                } else if (el.type === 'single-img') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + el.url + '">' });
                } else if (el.type === 'center') {
                    if (blockBuffer !== "") { PAGINATED_PAGES.push({ type: 'text', data: blockBuffer }); blockBuffer = ""; }
                    PAGINATED_PAGES.push({ type: 'center', data: el.data });
                } else {
                    blockBuffer += el.data || el;
                }
            });
            if (blockBuffer !== "") PAGINATED_PAGES.push({ type: 'text', data: blockBuffer });
            currentSpread = 0;
            updateUI();
            return;
        }

        const bookSpread = document.querySelector('.book-spread');
        const spreadWidth = bookSpread.clientWidth;
        if (!spreadWidth || spreadWidth === 0) { requestAnimationFrame(() => reflowContent()); return; }

        const ratio = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spread-ratio')) || 1.33;
        const spreadHeight = spreadWidth / ratio;
        const targetWidth = (spreadWidth / 2) - 1;
        const pageHeight = spreadHeight - 2;

        const sandbox = document.getElementById('sandbox');
        sandbox.innerHTML = '<article class="page" style="width:' + targetWidth + 'px; height:' + pageHeight + 'px; padding:60px 80px; box-sizing:border-box; overflow:hidden;"><div class="content" id="sand-c" style="width:100%; height:100%; overflow:hidden;"></div></article>';
        const sandC = document.getElementById('sand-c');
        const maxHeight = sandC.offsetHeight;

        if (!maxHeight || maxHeight === 0) {
            sandbox.innerHTML = "";
            requestAnimationFrame(() => reflowContent());
            return;
        }

        PAGINATED_PAGES = [];
        let currentPageBuffer = "";

        function flushTextBuffer() {
            if (currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = "";
            }
        }

        PARSED_ELEMENTS.forEach(element => {
            if (element.type === 'paired-double') {
                flushTextBuffer();
                if (PAGINATED_PAGES.length % 2 !== 0) PAGINATED_PAGES.push({ type: 'empty', data: "" });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.left + '">' });
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.right + '">' });
                return;
            }
            if (element.type === 'single-img') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'single', data: '<img src="' + element.url + '">' });
                return;
            }
            if (element.type === 'center') {
                flushTextBuffer();
                PAGINATED_PAGES.push({ type: 'center', data: element.data });
                return;
            }
            let inlineMarkup = element.data;
            sandC.innerHTML = currentPageBuffer + inlineMarkup;
            if (sandC.scrollHeight > maxHeight && currentPageBuffer !== "") {
                PAGINATED_PAGES.push({ type: 'text', data: currentPageBuffer });
                currentPageBuffer = inlineMarkup;
            } else {
                currentPageBuffer += inlineMarkup;
            }
        });

        flushTextBuffer();
        sandbox.innerHTML = "";
        currentSpread = 0;
        updateUI();
    }

    function renderPage(pageData, id) {
        if (!pageData) return '<article class="page" id="' + id + '"></article>';
        if (pageData.type === 'single') return '<article class="page no-padding" id="' + id + '">' + pageData.data + '</article>';
        if (pageData.type === 'center') return '<article class="page center-page" id="' + id + '"><div class="content">' + pageData.data + '</div></article>';
        if (pageData.type === 'text') return '<article class="page" id="' + id + '"><div class="content">' + pageData.data + '</div></article>';
        return '<article class="page" id="' + id + '"></article>';
    }

    function updateUI() {
        const container = document.getElementById('spread-content-area');
        container.innerHTML = "";
        if (PAGINATED_PAGES.length === 0) return;
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const bookSpreadElement = document.getElementById('spreadElement');
        if (isMobileView) {
            bookSpreadElement.style.display = "block"; bookSpreadElement.style.border = "none";
            const currentItem = PAGINATED_PAGES[currentSpread]; if (!currentItem) return;
            if (currentItem.type === 'single') { container.innerHTML = '<article class="page no-padding">' + currentItem.data + '</article>'; }
            else if (currentItem.type === 'center') { container.innerHTML = '<article class="page center-page"><div class="content">' + currentItem.data + '</div></article>'; }
            else { container.innerHTML = '<article class="page"><div class="content">' + currentItem.data + '</div></article>'; }
            handleSpoilerState(container); return;
        }
        bookSpreadElement.style.display = "grid"; bookSpreadElement.style.border = "1px solid var(--border-light)";
        const leftIndex = currentSpread * 2; const rightIndex = leftIndex + 1;
        const leftPageData = PAGINATED_PAGES[leftIndex]; const rightPageData = PAGINATED_PAGES[rightIndex];
        let leftHtml = renderPage(leftPageData, 'L-PAGE');
        let rightHtml = rightPageData ? renderPage(rightPageData, 'R-PAGE') : '<article class="page" id="R-PAGE" style="display:none;"></article>';
        container.innerHTML = leftHtml + rightHtml;
        handleSpoilerState(container);
    }

    function handleSpoilerState(container) {
        const isSpoilerOn = localStorage.getItem('spoiler-mode') === 'true';
        const pages = container.querySelectorAll('.page');
        pages.forEach(page => {
            if (isSpoilerOn && page.classList.contains('no-padding')) {
                page.classList.add('spoiler-active');
                page.onclick = (e) => { if (page.classList.contains('spoiler-active') && !page.classList.contains('revealed')) { e.stopPropagation(); page.classList.add('revealed'); } };
            }
        });
    }

    function nextPage() {
        const isMobileView = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
        const activeSpoiler = document.querySelector('.spoiler-active:not(.revealed)');
        if (activeSpoiler) { activeSpoiler.classList.add('revealed'); return; }
        if (isMobileView) { if (currentSpread + 1 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
        else { if ((currentSpread + 1) * 2 < PAGINATED_PAGES.length) { currentSpread++; updateUI(); window.scrollTo({ top: 0 }); } }
    }

    function prevPage() { if (currentSpread > 0) { currentSpread--; updateUI(); window.scrollTo({ top: 0 }); } }

    function updateRatio(val) {
        if (val !== "1.33" && val !== "1.5" && val !== "1.25") val = "1.33";
        document.documentElement.style.setProperty('--spread-ratio', val);
        document.body.setAttribute('data-ratio', val);
        localStorage.setItem('individuals-ratio', val);
        setTimeout(() => reflowContent(), 100);
    }

    window.addEventListener('resize', () => setTimeout(() => reflowContent(), 100));

    window.onload = () => {
        if (localStorage.getItem('site-theme') === 'light') document.body.classList.add('light-theme');
        let saved = localStorage.getItem('individuals-ratio') || "1.33";
        if (saved !== "1.33" && saved !== "1.5" && saved !== "1.25") saved = "1.33";
        document.getElementById('ratioSelect').value = saved;
        updateRatio(saved);
    };</script>
</body>
</html>
